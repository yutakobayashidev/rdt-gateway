[package]
name = "rdt-mcp"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
rdt-gateway-client = { path = "../rdt-gateway-client" }
rdt-gateway-types = { path = "../rdt-gateway-types", features = ["schema"] }
rmcp = { version = "3.5.0", default-features = false, features = ["server", "macros", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "net", "process", "time"] }
