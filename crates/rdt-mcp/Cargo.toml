[package]
name = "rdt-mcp"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
rdt-gateway = { path = "../rdt-gateway" }
rdt-request = { path = "../rdt-request" }
clap = { version = "4", features = ["derive", "env"] }
axum = "0.8"
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rdt-gateway-client = { path = "../rdt-gateway-client" }
rdt-gateway-types = { path = "../rdt-gateway-types", features = ["schema"] }
rmcp = { version = "3.5.0", default-features = false, features = ["server", "macros", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "net", "process", "time"] }
