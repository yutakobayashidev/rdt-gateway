name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  updater:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@2c9db80fb984ceb1bcaa77cdda3fdf8cfba92035 # v34
        with:
          github_access_token: ${{ github.token }}
          nix_conf: |
            access-tokens = github.com=${{ github.token }}
      - name: Test updater
        run: >-
          nix shell --inputs-from . nixpkgs#python3 nixpkgs#bash
          nixpkgs#ripgrep nixpkgs#coreutils
          -c python3 -m unittest discover -s scripts/tests -v

  nix:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@2c9db80fb984ceb1bcaa77cdda3fdf8cfba92035 # v34
        with:
          github_access_token: ${{ github.token }}
          nix_conf: |
            access-tokens = github.com=${{ github.token }}
            system-features = nixos-test benchmark big-parallel kvm
            max-jobs = 2
      - name: Run workspace and NixOS tests
        run: nix flake check --no-update-lock-file -L
      - name: Build gateway, CLI, and MCP packages
        run: nix build --no-update-lock-file --no-link -L .#rdt-gateway .#rdt-cli .#rdt-mcp
